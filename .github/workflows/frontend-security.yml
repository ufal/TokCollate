name: Frontend dependency security

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-fix:
    name: Audit and apply safe fixes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply npm audit fixes
        run: npm audit fix

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Create dependency update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(frontend): apply npm security updates"
          title: "chore(frontend): apply weekly npm security updates"
          body: |
            This automated pull request applies fixes reported by `npm audit fix`.

            It includes a production build and frontend test run before opening the pull request.
          branch: automated/frontend-npm-security
          delete-branch: true
