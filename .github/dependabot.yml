version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      frontend-runtime:
        patterns:
          - "react*"
          - "chart*"
          - "recharts"
          - "express"
          - "cors"
          - "multer"
          - "html2canvas"
      frontend-tooling:
        patterns:
          - "vite*"
          - "vitest"
          - "typescript"
          - "@types/*"
